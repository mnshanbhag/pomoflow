<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0d1a" />
  <title>PomoFlow — Configurable Pomodoro Timer</title>
  <link rel="stylesheet" href="/styles.css" />
  <!-- Same tomato as the header mark, simplified for 16px legibility. -->
  <link rel="icon" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><ellipse cx='32' cy='39' rx='22' ry='20.5' fill='%23f0322b'/><circle cx='32' cy='39' r='14' fill='%232a0f1c' opacity='0.22'/><path d='M32 25a14 14 0 0 1 14 14h-14z' fill='%23ffffff' opacity='0.92'/><g fill='%233aa655' transform='translate(32 19)'><ellipse rx='9.5' ry='3.5'/><ellipse rx='9.5' ry='3.5' transform='rotate(72)'/><ellipse rx='9.5' ry='3.5' transform='rotate(144)'/><ellipse rx='9.5' ry='3.5' transform='rotate(216)'/><ellipse rx='9.5' ry='3.5' transform='rotate(288)'/></g></svg>" />
</head>
<body>
  <main class="app">
    <header class="brand">
      <!-- Tomato-as-timer: the white quarter wedge is a clock dial, echoing the
           progress ring below and tying the mark to the Pomodoro idea. -->
      <svg class="logo" viewBox="0 0 64 64" aria-hidden="true" focusable="false">
        <defs>
          <radialGradient id="tomato-body" cx="34%" cy="28%" r="80%">
            <stop offset="0%"   stop-color="#ff8f76" />
            <stop offset="45%"  stop-color="#f5453a" />
            <stop offset="100%" stop-color="#c0161f" />
          </radialGradient>
        </defs>
        <ellipse cx="32" cy="39" rx="22" ry="20.5" fill="url(#tomato-body)" />
        <!-- recessed dial face -->
        <circle cx="32" cy="39" r="14" fill="#2a0f1c" opacity=".22" />
        <path d="M32 25a14 14 0 0 1 14 14h-14z" fill="#fff" opacity=".92" />
        <circle cx="32" cy="39" r="2" fill="#fff" />
        <!-- five-petal calyx -->
        <g fill="#3aa655" transform="translate(32 19)">
          <ellipse rx="9.5" ry="3.5" />
          <ellipse rx="9.5" ry="3.5" transform="rotate(72)" />
          <ellipse rx="9.5" ry="3.5" transform="rotate(144)" />
          <ellipse rx="9.5" ry="3.5" transform="rotate(216)" />
          <ellipse rx="9.5" ry="3.5" transform="rotate(288)" />
        </g>
        <path d="M32 19c0-4 1.5-7 4.5-9" fill="none" stroke="#3aa655"
              stroke-width="3.2" stroke-linecap="round" />
      </svg>
      <h1 class="brand-title">PomoFlow</h1>
    </header>

    <!-- Configuration drawer -->
    <!-- Starts collapsed; the class is set here rather than in JS so the panel
         never flashes open before the script runs. -->
    <section class="panel config-panel is-collapsed" aria-labelledby="config-heading">
      <div class="panel-header">
        <h2 id="config-heading">Settings</h2>
        <button class="btn btn-ghost" id="toggle-config" type="button"
                aria-expanded="false" aria-controls="config-body" aria-label="Toggle settings">
          <span class="chev" aria-hidden="true">▾</span>
        </button>
      </div>
      <!-- One row per setting: label left, compact control right. Preferences
           save themselves on change, so there is no Save button. -->
      <div class="config-grid" id="config-body">
        <label class="setting">
          <span class="setting-label">Focus</span>
          <span class="stepper-control">
            <button type="button" data-step="-1" data-target="focus_minutes" aria-label="Decrease focus">−</button>
            <input type="number" id="focus_minutes" min="1" max="120" step="1" />
            <span class="unit">min</span>
            <button type="button" data-step="1" data-target="focus_minutes" aria-label="Increase focus">+</button>
          </span>
        </label>

        <label class="setting">
          <span class="setting-label">Short break</span>
          <span class="stepper-control">
            <button type="button" data-step="-1" data-target="short_break_minutes" aria-label="Decrease short break">−</button>
            <input type="number" id="short_break_minutes" min="1" max="30" step="1" />
            <span class="unit">min</span>
            <button type="button" data-step="1" data-target="short_break_minutes" aria-label="Increase short break">+</button>
          </span>
        </label>

        <label class="setting">
          <span class="setting-label">Long break</span>
          <span class="stepper-control">
            <button type="button" data-step="-1" data-target="long_break_minutes" aria-label="Decrease long break">−</button>
            <input type="number" id="long_break_minutes" min="5" max="60" step="1" />
            <span class="unit">min</span>
            <button type="button" data-step="1" data-target="long_break_minutes" aria-label="Increase long break">+</button>
          </span>
        </label>

        <label class="setting">
          <span class="setting-label">Sessions before long break</span>
          <span class="stepper-control">
            <button type="button" data-step="-1" data-target="sessions_before_long_break" aria-label="Decrease sessions before long break">−</button>
            <input type="number" id="sessions_before_long_break" min="2" max="10" step="1" />
            <span class="unit">×</span>
            <button type="button" data-step="1" data-target="sessions_before_long_break" aria-label="Increase sessions before long break">+</button>
          </span>
        </label>

        <label class="setting">
          <span class="setting-label">Sound chime</span>
          <input type="checkbox" id="sound_enabled" />
        </label>

        <label class="setting">
          <span class="setting-label">Desktop notifications</span>
          <input type="checkbox" id="notifications_enabled" />
        </label>

        <div class="config-foot">
          <span class="save-status" id="save-status" role="status" aria-live="polite"></span>
          <!-- Two-step inline confirm rather than confirm(); a modal dialog here
               would block the page and is heavier than the action deserves. -->
          <span class="danger-zone">
            <button class="btn btn-quiet btn-danger" id="clear-stats" type="button">Clear stats</button>
            <span class="confirm" id="clear-confirm" hidden>
              <span class="confirm-q">Clear today's stats and history?</span>
              <button class="btn btn-quiet btn-danger" id="clear-yes" type="button">Clear</button>
              <button class="btn btn-quiet" id="clear-no" type="button">Cancel</button>
            </span>
          </span>
        </div>
      </div>
    </section>

    <!-- Timer display -->
    <section class="panel timer-panel" aria-labelledby="phase-label">
      <p class="phase" id="phase-label">Focus</p>
      <div class="ring" role="timer" aria-live="off" aria-atomic="true">
        <svg viewBox="0 0 220 220" aria-hidden="true">
          <circle class="ring-track" cx="110" cy="110" r="100" />
          <circle class="ring-progress" id="ring-progress" cx="110" cy="110" r="100" />
        </svg>
        <div class="ring-center">
          <span class="time" id="time-display">25:00</span>
          <span class="cycle" id="cycle-display">Focus 1 / 4</span>
        </div>
      </div>
      <div class="controls">
        <button class="btn btn-secondary" id="reset-btn" type="button">Reset</button>
        <button class="btn btn-primary" id="start-btn" type="button">Start</button>
        <button class="btn btn-secondary" id="skip-btn" type="button">Skip ▶</button>
      </div>
    </section>

    <!-- Stats -->
    <section class="panel stats-panel" aria-labelledby="stats-heading">
      <h2 id="stats-heading" class="sr-only">Today</h2>
      <div class="stats-row">
        <div class="stat">
          <span class="stat-value" id="stat-sessions">0</span>
          <span class="stat-label">Pomodoros today</span>
        </div>
        <div class="stat">
          <span class="stat-value" id="stat-minutes">0</span>
          <span class="stat-label">Focus minutes today</span>
        </div>
        <div class="stat stat-history">
          <span class="stat-label">Recent sessions</span>
          <ul class="history" id="history-list" aria-live="polite"></ul>
        </div>
      </div>
    </section>

    <!-- Bump both values below when cutting a release; there is no build step
         to inject them, so they are the single source of truth. -->
    <footer class="foot">
      <small>Phase complete fires sound + notification (when enabled). Preferences &amp; today's stats persist across reloads.</small>
      <small class="foot-meta">
        <span class="version">v1.0</span>
        <span class="foot-sep" aria-hidden="true">·</span>
        <span>Deployed <time datetime="2026-08-10">10-Aug-2026</time></span>
      </small>
    </footer>
  </main>

  <script src="/app.js" defer></script>
</body>
</html>
